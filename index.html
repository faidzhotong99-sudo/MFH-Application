<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFH Islamic Apps</title>
    <style>
        :root {
            --primary: #0d5c3a;
            --primary-hover: #084028;
            --accent: #d4af37;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #212529;
            --text-muted: #6c757d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animated Mosaic & Glitter Header */
        header {
            position: relative;
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 3.5rem 1rem;
            border-bottom: 4px solid var(--accent);
            overflow: hidden;
        }

        /* Pure CSS Looping Islamic Mosaic Pattern */
        header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            opacity: 0.18;
            background-image: 
                radial-gradient(circle, var(--accent) 2px, transparent 2px),
                radial-gradient(circle, var(--accent) 2px, transparent 2px),
                linear-gradient(45deg, transparent 74%, rgba(212, 175, 55, 0.4) 75%, transparent 76%),
                linear-gradient(-45deg, transparent 74%, rgba(212, 175, 55, 0.4) 75%, transparent 76%);
            background-size: 40px 40px, 40px 40px, 60px 60px, 60px 60px;
            background-position: 0 0, 20px 20px, 0 0, 0 0;
            animation: rotateMosaic 60s linear infinite;
            z-index: 1;
        }

        /* Glitter Overlay Effect */
        header::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 223, 118, 0.3) 50%, 
                transparent
            );
            transform: skewX(-25deg);
            animation: glitterShine 6s ease-in-out infinite;
            z-index: 2;
        }

        header h1, header p {
            position: relative;
            z-index: 3;
        }

        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.95;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* Animations */
        @keyframes rotateMosaic {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.1);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes glitterShine {
            0% {
                left: -100%;
            }
            30%, 100% {
                left: 200%;
            }
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            flex-shrink: 0;
            overflow: hidden;
            background-color: transparent;
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        .app-title {
            font-size: 1.25rem;
            color: var(--primary);
        }

        .app-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 1.5rem;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .btn {
            display: block;
            text-align: center;
            padding: 0.75rem 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            transition: opacity 0.2s;
            font-size: 0.9rem;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-secondary {
            background-color: #e9ecef;
            color: var(--text);
        }

        .btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>MFH Islamic App Suite</h1>
        <p>Kemon application manaan inin originally kite maghinangin duk gey inin takasuwah si Playstore. InshaAllah free inin kemon duk free adds pe </p>
    </header>

    <main>
        <div id="app-grid" class="app-grid">
            <!-- Dynamic app cards loaded via JavaScript from apps.json -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 MFH Islamic App Suite. All rights reserved.</p>
    </footer>

    <script>
        fetch('apps.json')
            .then(response => response.json())
            .then(apps => {
                const container = document.getElementById('app-grid');
                container.innerHTML = apps.map(app => {
                    const isImage = app.icon && (
                        app.icon.endsWith('.png') || 
                        app.icon.endsWith('.jpg') || 
                        app.icon.endsWith('.jpeg') || 
                        app.icon.endsWith('.webp') || 
                        app.icon.endsWith('.svg')
                    );
                    
                    const iconHtml = isImage 
                        ? `<img src="${app.icon}" alt="${app.title} icon">` 
                        : (app.icon || '☪');

                    return `
                        <div class="app-card">
                            <div>
                                <div class="app-header">
                                    <div class="app-icon">${iconHtml}</div>
                                    <div>
                                        <h2 class="app-title">${app.title}</h2>
                                        <small style="color: var(--text-muted);">v${app.version}</small>
                                    </div>
                                </div>
                                <p class="app-description">${app.description}</p>
                            </div>
                            <div class="download-links">
                                ${app.links.map(link => `
                                    <a href="${link.url}" class="btn btn-${link.type || 'primary'}" download>${link.label}</a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }).join('');
            })
            .catch(error => console.error('Error loading apps:', error));
    </script>

</body>
</html>
